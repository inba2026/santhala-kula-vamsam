
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Registration | சந்தல குல வம்சம்</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#222}
header{background:linear-gradient(135deg,#16324f,#254f70);color:white;padding:25px;text-align:center}
main{max-width:700px;margin:20px auto;padding:15px}
.card{background:white;padding:22px;border-radius:15px;box-shadow:0 4px 15px #0001}
form{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}
input,select,textarea{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{grid-column:1/-1;padding:14px;background:#16324f;color:white;border:0;border-radius:9px;font-size:17px}
.notice{background:#eef5fa;padding:12px;border-radius:8px}
@media(max-width:560px){form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<h1>சந்தல குல வம்சம்</h1>
<p>Member Registration / உறுப்பினர் பதிவு</p>
</header>
<main>
<section class="card">
<p>Welcome! Please complete this form to register.</p>
<div class="notice"><b>Privacy:</b> Your details will be used for community registration and reviewed by the administrator.</div>
<br>
<form id="registrationForm">
<div class="field full"><label for="name">Full Name / முழு பெயர்</label><input id="name" required></div>
<div class="field"><label for="mobile">Mobile Number</label><input id="mobile" type="tel" required></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
<div class="field"><label for="district">District</label><input id="district" required></div>
<div class="field"><label for="town">Town / Village</label><input id="town" required></div>
<div class="field"><label for="age">Age (optional)</label><input id="age" type="number"></div>
<div class="field"><label for="occupation">Occupation</label><input id="occupation"></div>
<div class="field"><label for="language">Preferred Language</label>
<select id="language"><option>Tamil</option><option>English</option><option>Both</option></select></div>
<div class="field full"><label for="info">Additional Information</label><textarea id="info" rows="3"></textarea></div>
<div class="field full"><label><input id="consent" type="checkbox" required> I agree to submit my information for registration.</label></div>
<button type="submit" id="submitBtn">Submit Registration</button>
</form>
<p id="message"></p>
</section>
</main>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz_PUStNhCRx2nqgptUtTK_yeOy0awXRGqnZ_BaHR1vI22ciLUhnmHRdQ9IkqD-ia1v/exec";

document.getElementById("registrationForm").addEventListener("submit",async function(e){
e.preventDefault();
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");
btn.disabled=true;
btn.textContent="Submitting...";
const data={
name:document.getElementById("name").value,
mobile:document.getElementById("mobile").value,
email:document.getElementById("email").value,
district:document.getElementById("district").value,
town:document.getElementById("town").value,
age:document.getElementById("age").value,
occupation:document.getElementById("occupation").value,
language:document.getElementById("language").value,
info:document.getElementById("info").value,
consent:document.getElementById("consent").checked
};
try{
await fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(data)
});
msg.textContent="Your submission has been sent. Please allow time for confirmation.";
msg.style.color="green";
this.reset();
}catch(err){
msg.textContent="Submission could not be sent. Please try again.";
msg.style.color="red";
}
btn.disabled=false;
btn.textContent="Submit Registration";
});
</script>
</body>
</html>
